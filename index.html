<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MyChat</title>

    <link rel="stylesheet" href="/style.css">

    <script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>
<style>
.list-title{padding:8px 14px;font-size:11px;font-weight:700;opacity:.6;letter-spacing:.08em}.group-sender{font-size:11px;font-weight:700;margin:0 0 3px 3px}.avatar img{width:100%;height:100%;object-fit:cover;border-radius:50%}.modal.show{display:flex!important}.contact{cursor:pointer}.unread-badge{margin-left:auto}.bubble{white-space:pre-wrap;line-height:1.35}
</style>
</head>

<body>

<!-- =========================================================
     AUTH PAGE
========================================================= -->

<div class="auth-page" id="authPage">

    <div class="auth-box">

        <h1>MyChat</h1>

        <p class="auth-subtitle">
            Simple private messaging
        </p>


        <!-- LOGIN -->

        <div id="loginForm">

            <h2>Welcome Back</h2>

            <input
                type="email"
                id="loginEmail"
                placeholder="Email address"
            >

            <input
                type="password"
                id="loginPassword"
                placeholder="Password"
            >

            <button
                onclick="login()"
                title="Login"
            >
                ➔ Login
            </button>

            <p class="switch-text">
                Don't have an account?
                <span onclick="showSignup()">
                    Sign Up
                </span>
            </p>

        </div>


        <!-- SIGNUP -->

        <div
            id="signupForm"
            style="display:none;"
        >

            <h2>Create Account</h2>

            <input
                type="text"
                id="signupName"
                placeholder="Your name"
            >

            <input
                type="email"
                id="signupEmail"
                placeholder="Email address"
            >

            <input
                type="password"
                id="signupPassword"
                placeholder="Password"
            >

            <button
                onclick="signup()"
                title="Create Account"
            >
                👤 Create Account
            </button>

            <p class="switch-text">
                Already have an account?
                <span onclick="showLogin()">
                    Login
                </span>
            </p>

        </div>


        <p id="authMessage"></p>

    </div>

</div>


<!-- =========================================================
     CHAT APP
========================================================= -->

<div
    class="app"
    id="chatApp"
    style="display:none;"
>


    <!-- =====================================================
         SIDEBAR
    ====================================================== -->

    <aside class="sidebar">

        <div class="sidebar-header">

            <h1>MyChat</h1>

            <button
                class="profile-btn"
                onclick="logout()"
                title="Logout"
            >
                🚪 Logout
            </button>

        </div>


        <div class="current-user">

            Logged in as:
            <b id="currentUserName"></b>

        </div>


        <div class="search-box">

            <input
                type="text"
                id="searchInput"
                placeholder="Search contacts..."
            >

        </div>


        <div class="sidebar-actions">
        <button class="add-contact-btn" onclick="openProfileModal()">👤 Profile</button>
        <button class="add-contact-btn" onclick="openGroupModal()">👥 New Group</button>
        </div>
        <button
            class="add-contact-btn"
            id="addContactBtn"
            title="Add Contact"
        >
            ➕ Add Contact
        </button>


        <div
            class="contacts"
            id="contacts"
        ></div>

    </aside>



    <!-- =====================================================
         CHAT
    ====================================================== -->

    <main class="chat">


        <!-- CHAT HEADER -->

        <header class="chat-header">

            <div class="chat-user">

                <div
                    class="avatar"
                    id="chatAvatar"
                >
                </div>


                <div>

                    <h2 id="chatName">
                        Select a contact
                    </h2>

                    <p id="chatStatus">
                    </p>

                </div>

            </div>

        </header>



        <!-- =================================================
             MESSAGES
        ================================================== -->

        <div
            class="messages"
            id="messages"
        >

            <div class="empty-chat">
                Select a contact to start chatting
            </div>

        </div>



        <!-- =================================================
             TYPING INDICATOR
        ================================================== -->

        <div
            id="typingIndicator"
            class="typing-indicator"
            style="display:none;"
        >
            <span id="typingText">
                Typing...
            </span>

            <span class="typing-dots">
                <i></i>
                <i></i>
                <i></i>
            </span>
        </div>



        <!-- =================================================
             MESSAGE AREA
        ================================================== -->

        <div class="message-area">

            <button
                class="file-btn"
                id="fileBtn"
                title="Send file"
                disabled
            >
                📎
            </button>


            <input
                type="file"
                id="fileInput"
                style="display:none;"
                accept="image/*,video/*,.pdf,.txt,.doc,.docx,.xls,.xlsx,.zip"
            >


            <input
                type="text"
                id="messageInput"
                placeholder="Type a message..."
                disabled
                autocomplete="off"
            >


            <button
                class="send-btn"
                id="sendBtn"
                title="Send"
                disabled
            >
                ✈
            </button>

        </div>

    </main>

</div>



<!-- =========================================================
     ADD CONTACT MODAL
========================================================= -->

<div
    class="modal"
    id="contactModal"
>

    <div class="modal-box">

        <button
            class="close-btn"
            id="closeModal"
            title="Close"
        >
            ✖
        </button>

        <h2>Add Contact</h2>

        <p>
            Enter your friend's email address
        </p>

        <input type="email" id="emailInput" placeholder="friend@example.com">
        <input type="text" id="contactNameInput" placeholder="Save as name (optional)">

        <button
            class="confirm-btn"
            id="confirmContact"
            title="Add Contact"
        >
            ✔
        </button>

        <p
            id="contactMessage"
            style="text-align:center;"
        ></p>

    </div>

</div>



<!-- =========================================================
     NOTIFICATION
========================================================= -->

<div
    id="notification"
    class="chat-notification"
    style="display:none;"
>
    <span id="notificationText"></span>
</div>



<script>

/* =========================================================
   GLOBAL VARIABLES
========================================================= */

let currentUser = null;

let selectedContact = null;

let socket = null;

let typingTimer = null;

let isTyping = false;

let typingUserId = null;

let notificationPermissionAsked = false;


/* =========================================================
   SOCKET.IO
========================================================= */

function connectSocket() {

    if (socket) {

        try {

            socket.removeAllListeners();

            socket.disconnect();

        } catch (e) {}

    }


    console.log(
        "Connecting to chat server..."
    );


    socket = io("/", {

        transports: [
            "websocket",
            "polling"
        ],

        upgrade: true,

        reconnection: true,

        reconnectionAttempts: Infinity,

        reconnectionDelay: 500,

        reconnectionDelayMax: 3000,

        timeout: 20000

    });



    /* =====================================================
       CONNECTED
    ===================================================== */

    socket.on(
        "connect",
        function() {

            console.log(
                "Socket.IO connected:",
                socket.id
            );


            updateSelectedContactStatus();


            /*
             * Pending message
             */

            if (window.pendingMessage) {

                const pending =
                    window.pendingMessage;

                window.pendingMessage =
                    null;


                socket.emit(
                    "send_message",
                    {
                        receiver_id:
                            Number(
                                pending.receiver_id
                            ),

                        message:
                            pending.message
                    }
                );

            }

        }
    );



    /* =====================================================
       ONLINE USERS
    ===================================================== */

    socket.on(
        "online_users",
        function(data) {

            if (!data) {
                return;
            }


            const users =
                data.users || [];


            document
                .querySelectorAll(
                    ".contact"
                )
                .forEach(
                    function(contact) {

                        const id =
                            Number(
                                contact.dataset.id
                            );


                        updateContactOnlineUI(
                            id,
                            users.includes(id)
                        );

                    }
                );


            updateSelectedContactStatus();

        }
    );



    /* =====================================================
       USER STATUS
    ===================================================== */

    socket.on(
        "user_status",
        function(data) {

            if (!data) {
                return;
            }


            const userId =
                Number(
                    data.user_id
                );


            updateContactOnlineUI(
                userId,
                Boolean(
                    data.online
                )
            );


            if (
                selectedContact &&
                Number(
                    selectedContact.id
                ) === userId
            ) {

                updateSelectedContactStatus(
                    Boolean(
                        data.online
                    )
                );

            }

        }
    );



    /* =====================================================
       TYPING
    ===================================================== */

    socket.on(
        "user_typing",
        function(data) {

            if (!data) {
                return;
            }


            const userId =
                Number(
                    data.user_id
                );


            if (
                !selectedContact ||
                Number(
                    selectedContact.id
                ) !== userId
            ) {

                return;

            }


            if (data.typing) {

                showTypingIndicator(
                    selectedContact.name
                );

            } else {

                hideTypingIndicator();

            }

        }
    );



    /* =====================================================
       MESSAGE SENT
    ===================================================== */

    socket.on(
        "message_sent",
        function(message) {

            console.log(
                "MESSAGE SENT:",
                message
            );


            if (!message) {
                return;
            }


            /*
             * IMPORTANT:
             *
             * Do NOT immediately add the
             * message twice.
             *
             * Server sends message_sent
             * only to sender.
             */

            if (
                selectedContact &&
                Number(
                    selectedContact.id
                ) ===
                Number(
                    message.receiver_id
                )
            ) {

                addMessageToScreen(
                    message
                );

            }


            loadContacts();

        }
    );



    /* =====================================================
       MESSAGE DELIVERED
    ===================================================== */

    socket.on(
        "message_delivered",
        function(data) {

            if (!data) {
                return;
            }


            console.log(
                "MESSAGE DELIVERED:",
                data
            );


            updateMessageStatus(
                data.message_id,
                "delivered"
            );

        }
    );



    /* =====================================================
       MESSAGES READ
    ===================================================== */

    socket.on(
        "messages_read",
        function(data) {

            if (!data) {
                return;
            }

            console.log(
                "MESSAGES READ:",
                data
            );

            // Update only the exact messages that the other user read.
            // This makes the blue ✓✓ change immediately without waiting
            // for a reload or relying on the currently selected chat.
            const messageIds =
                Array.isArray(data.message_ids)
                    ? data.message_ids
                    : [];

            messageIds.forEach(
                function(messageId) {
                    updateMessageStatus(
                        Number(messageId),
                        "seen"
                    );
                }
            );

            // Backwards compatibility with older server payloads.
            if (messageIds.length === 0) {
                const contactId =
                    Number(data.contact_id);

                if (
                    selectedContact &&
                    Number(selectedContact.id) === contactId
                ) {
                    markVisibleMessagesAsSeen();
                }
            }
        }
    );



    /* =====================================================
       NEW MESSAGE
    ===================================================== */

    socket.on(
        "new_message",
        async function(message) {

            console.log(
                "NEW MESSAGE:",
                message
            );


            if (!message) {
                return;
            }


            // Confirm delivery only after this client has actually received
            // the message. The server then sends ✓✓ to the sender.
            if (socket && message.id && message.sender_id) {
                socket.emit(
                    "message_delivered_ack",
                    {
                        message_id: Number(message.id),
                        sender_id: Number(message.sender_id)
                    }
                );
            }


            const senderId =
                Number(
                    message.sender_id
                );


            /*
             * CURRENT CHAT OPEN
             */

            if (
                selectedContact &&
                Number(
                    selectedContact.id
                ) === senderId
            ) {

                addMessageToScreen(
                    message
                );


                /*
                 * The message is visible in the currently open chat,
                 * so acknowledge it as read immediately over Socket.IO.
                 * The server persists is_read=1 and broadcasts the exact
                 * message IDs back to the sender in real time.
                 */
                if (socket) {
                    socket.emit(
                        "mark_read",
                        {
                            contact_id:
                                senderId
                        }
                    );
                }


                loadContacts();


                return;

            }



            /*
             * MESSAGE FROM OTHER CONTACT
             */

            try {

                const response =
                    await fetch(
                        "/api/user/" +
                        senderId
                    );


                const data =
                    await response.json();


                if (
                    data.success &&
                    data.user
                ) {

                    const sender =
                        data.user;


                    const existingContact =
                        document.querySelector(
                            '.contact[data-id="' +
                            sender.id +
                            '"]'
                        );


                    if (!existingContact) {

                        createTemporaryContact(
                            sender,
                            message
                        );

                    }

                }

            } catch (error) {

                console.error(
                    "Could not get sender:",
                    error
                );

            }


            loadContacts();


            /*
             * Notification
             */

            showNotification(
                "New message from " +
                (
                    selectedContact &&
                    Number(
                        selectedContact.id
                    ) === senderId
                        ? selectedContact.name
                        : "a contact"
                )
            );


            playNotificationSound();

        }
    );



    /* =====================================================
       MESSAGE ERROR
    ===================================================== */

    socket.on(
        "message_error",
        function(data) {

            console.error(
                "MESSAGE ERROR:",
                data
            );


            if (
                data &&
                data.message
            ) {

                showNotification(
                    data.message
                );

            }

        }
    );



    /* =====================================================
       CONNECTION ERROR
    ===================================================== */

    socket.on(
        "connect_error",
        function(error) {

            console.error(
                "Socket.IO connection error:",
                error
            );

        }
    );



    /* =====================================================
       DISCONNECT
    ===================================================== */

    socket.on(
        "disconnect",
        function(reason) {

            console.log(
                "Socket.IO disconnected:",
                reason
            );


            /*
             * If chat is open,
             * show temporary offline state.
             */

            if (selectedContact) {

                const status =
                    document.getElementById(
                        "chatStatus"
                    );


                if (status) {

                    status.textContent =
                        "Connecting...";

                }

            }

        }
    );

}



/* =========================================================
   AUTH UI
========================================================= */

function showLogin() {

    document.getElementById(
        "loginForm"
    ).style.display =
        "block";


    document.getElementById(
        "signupForm"
    ).style.display =
        "none";


    document.getElementById(
        "authMessage"
    ).textContent =
        "";

}



function showSignup() {

    document.getElementById(
        "loginForm"
    ).style.display =
        "none";


    document.getElementById(
        "signupForm"
    ).style.display =
        "block";


    document.getElementById(
        "authMessage"
    ).textContent =
        "";

}



function showAuthMessage(
    message,
    color
) {

    const element =
        document.getElementById(
            "authMessage"
        );


    element.textContent =
        message;


    element.style.color =
        color;

}



/* =========================================================
   SIGNUP
========================================================= */

async function signup() {

    const name =
        document.getElementById(
            "signupName"
        ).value.trim();


    const email =
        document.getElementById(
            "signupEmail"
        ).value.trim();


    const password =
        document.getElementById(
            "signupPassword"
        ).value;


    if (
        !name ||
        !email ||
        !password
    ) {

        showAuthMessage(
            "Please fill all fields.",
            "red"
        );

        return;

    }


    try {

        const response =
            await fetch(
                "/api/signup",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({
                            name:
                                name,

                            email:
                                email,

                            password:
                                password
                        })
                }
            );


        const data =
            await response.json();


        if (data.success) {

            showAuthMessage(
                "Account created! You can login now.",
                "green"
            );


            document.getElementById(
                "signupName"
            ).value = "";


            document.getElementById(
                "signupEmail"
            ).value = "";


            document.getElementById(
                "signupPassword"
            ).value = "";


            setTimeout(
                showLogin,
                1000
            );

        } else {

            showAuthMessage(
                data.message,
                "red"
            );

        }

    } catch (error) {

        console.error(
            error
        );


        showAuthMessage(
            "Server connection error.",
            "red"
        );

    }

}



/* =========================================================
   LOGIN
========================================================= */

async function login() {

    const email =
        document.getElementById(
            "loginEmail"
        ).value.trim();


    const password =
        document.getElementById(
            "loginPassword"
        ).value;


    if (
        !email ||
        !password
    ) {

        showAuthMessage(
            "Enter your email and password.",
            "red"
        );

        return;

    }


    try {

        const response =
            await fetch(
                "/api/login",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({
                            email:
                                email,

                            password:
                                password
                        })
                }
            );


        const data =
            await response.json();


        if (data.success) {

            currentUser =
                data.user;


            document.getElementById(
                "authPage"
            ).style.display =
                "none";


            document.getElementById(
                "chatApp"
            ).style.display =
                "flex";


            document.getElementById(
                "currentUserName"
            ).textContent =
                currentUser.name;


            requestNotificationPermission();


            connectSocket();


            loadContacts();

        } else {

            showAuthMessage(
                data.message,
                "red"
            );

        }

    } catch (error) {

        console.error(
            error
        );


        showAuthMessage(
            "Server connection error.",
            "red"
        );

    }

}



/* =========================================================
   CHECK LOGIN
========================================================= */

async function checkLogin() {

    try {

        const response =
            await fetch(
                "/api/me"
            );


        const data =
            await response.json();


        if (data.logged_in) {

            currentUser =
                data.user;


            document.getElementById(
                "authPage"
            ).style.display =
                "none";


            document.getElementById(
                "chatApp"
            ).style.display =
                "flex";


            document.getElementById(
                "currentUserName"
            ).textContent =
                currentUser.name;


            requestNotificationPermission();


            connectSocket();


            loadContacts();

        }

    } catch (error) {

        console.error(
            "Server not available:",
            error
        );

    }

}



/* =========================================================
   LOGOUT
========================================================= */

async function logout() {

    if (socket) {

        try {

            socket.disconnect();

        } catch (e) {}

        socket = null;

    }


    try {

        await fetch(
            "/api/logout",
            {
                method: "POST"
            }
        );

    } catch (error) {

        console.error(
            error
        );

    }


    currentUser = null;

    selectedContact = null;


    document.getElementById(
        "chatApp"
    ).style.display =
        "none";


    document.getElementById(
        "authPage"
    ).style.display =
        "flex";


    document.getElementById(
        "messageInput"
    ).value =
        "";


    document.getElementById(
        "messageInput"
    ).disabled =
        true;


    document.getElementById(
        "sendBtn"
    ).disabled =
        true;


    document.getElementById(
        "fileBtn"
    ).disabled =
        true;


    hideTypingIndicator();


    showLogin();

}



/* =========================================================
   LOAD CONTACTS
========================================================= */

async function loadContacts() {

    try {

        const response =
            await fetch(
                "/api/contacts"
            );


        const data =
            await response.json();


        const container =
            document.getElementById(
                "contacts"
            );


        if (!container) {
            return;
        }


        container.innerHTML =
            "";


        if (!data.success) {
            return;
        }


        if (
            !data.contacts ||
            data.contacts.length === 0
        ) {

            container.innerHTML = `
                <div class="no-contacts">
                    No contacts yet.
                    <br><br>
                    Click Add Contact
                </div>
            `;

            return;

        }


        data.contacts.forEach(
            function(contact) {

                createContactElement(
                    contact,
                    container
                );

            }
        );


        updateSelectedContactStatus();

    } catch (error) {

        console.error(
            "Could not load contacts:",
            error
        );

    }

}



/* =========================================================
   CREATE CONTACT ELEMENT
========================================================= */

function createContactElement(
    contact,
    container
) {

    const div =
        document.createElement(
            "div"
        );


    div.className =
        "contact";


    div.dataset.id =
        contact.id;


    if (
        selectedContact &&
        Number(
            selectedContact.id
        ) ===
        Number(
            contact.id
        )
    ) {

        div.classList.add(
            "active"
        );

    }


    const firstLetter =
        contact.name
        .charAt(0)
        .toUpperCase();


    const unread =
        Number(
            contact.unread_count ||
            contact.unread ||
            0
        );


    let unreadBadge =
        "";


    if (unread > 0) {

        unreadBadge = `
            <span class="unread-badge">
                ${
                    unread > 99
                    ? "99"
                    : unread
                }
            </span>
        `;

    }


    const online =
        Boolean(
            contact.online
        );


    const statusDot =
        online
        ? `
            <span
                class="online-dot"
                title="Online"
            ></span>
          `
        : `
            <span
                class="offline-dot"
                title="Offline"
            ></span>
          `;


    let preview =
        contact.last_message ||
        contact.email ||
        "";


    div.innerHTML = `

        <div class="avatar contact-avatar">

            ${escapeHtml(firstLetter)}

            ${statusDot}

        </div>


        <div class="contact-info">

            <div class="contact-name">
                ${escapeHtml(contact.name)}
            </div>

            <div class="last-message">
                ${escapeHtml(preview)}
            </div>

        </div>


        <div class="contact-right">

            ${unreadBadge}

        </div>

    `;


    div.addEventListener(
        "click",
        function() {

            selectContact(
                contact
            );

        }
    );


    container.appendChild(
        div
    );

}



/* =========================================================
   CONTACT ONLINE UI
========================================================= */

function updateContactOnlineUI(
    userId,
    online
) {

    const contact =
        document.querySelector(
            '.contact[data-id="' +
            userId +
            '"]'
        );


    if (!contact) {
        return;
    }


    const avatar =
        contact.querySelector(
            ".contact-avatar"
        );


    if (!avatar) {
        return;
    }


    const oldDot =
        avatar.querySelector(
            ".online-dot, .offline-dot"
        );


    if (oldDot) {
        oldDot.remove();
    }


    const dot =
        document.createElement(
            "span"
        );


    dot.className =
        online
        ? "online-dot"

/* =========================================================
   SELECT CONTACT
========================================================= */

async function selectContact(

) {

        contact;


    document.getElementById(
        "chatName"
    ).textContent =
        contact.name;


    document.getElementById(
        "chatAvatar"
    ).textContent =

        .charAt(0)
        .toUpperCase();


    updateSelectedContactStatus();


    document.getElementById(
        "messageInput"
    ).disabled =
        false;


    document.getElementById(
        "sendBtn"
    ).disabled =
        false;


    document.getElementById(
        "fileBtn"
    ).disabled =
        false;


    hideTypingIndicator();


    // Load the conversation first, then tell the server that the
    // receiver is actually looking at this chat. The server will
    // broadcast the exact read message IDs back to the sender.
    await loadMessages(
        contact.id
    );


    if (socket) {
        socket.emit(
            "mark_read",
            {
                contact_id:
                    Number(contact.id)
            }
        );
    }


    loadContacts();


    document.getElementById(
        "messageInput"
    ).focus();

/* =========================================================
   LOAD MESSAGES
========================================================= */

async function loadMessages(
    contactId
) {

    try {

        const response =
            await fetch(
                "/api/messages/" +
                contactId
            );


        const data =
            await response.json();


        const container =
            document.getElementById(
                "messages"
            );


        container.innerHTML =
            "";


        if (!data.success) {
            return;
        }


        if (
            !data.messages ||
            data.messages.length === 0
        ) {

            container.innerHTML = `
                <div class="empty-chat">
                    No messages yet.
                    <br>
                    Say hello
                </div>
            `;

            return;

        }


        data.messages.forEach(
            function(message) {

                addMessageToScreen(
                    message
                );

            }
        );


        scrollMessages();

    } catch (error) {

        console.error(
            "Message loading error:",
            error
        );

    }

}



/* =========================================================
   ADD MESSAGE
========================================================= */

function addMessageToScreen(
    message
) {

    const container =
        document.getElementById(
            "messages"
        );


    if (!container) {
        return;
    }


    /*
     * Prevent duplicates.
     */

    if (message.id) {

        const existing =
            container.querySelector(
                '[data-message-id="' +
                message.id +
                '"]'
            );


        if (existing) {

            /*
             * Existing message may have
             * received a new read status.
             */

            updateExistingMessageStatus(
                existing,
                message
            );

            return;

        }

    }


    /*
     * Remove empty message.
     */

    const empty =
        container.querySelector(
            ".empty-chat"
        );


    if (empty) {
        empty.remove();
    }


    const div =
        document.createElement(
            "div"
        );


    const isMine =
        Number(
            message.sender_id
        ) ===
        Number(
            currentUser.id
        );


    div.className =
        isMine
        ? "message sent"
        : "message received";


    if (message.id) {

        div.dataset.messageId =
            message.id;

    }


    let content =
        "";


    /*
     * TEXT
     */

    if (message.message) {

        content += `<div class="bubble">${escapeHtml(
            String(message.message || "").trim()
        )}</div>`;

    }



    /*
     * IMAGE
     */

    if (
        message.message_type ===
        "image"
    ) {

        content += `

            <div class="file-message">

                <img
                    src="${escapeHtml(
                        message.file_url
                    )}"
                    class="chat-image"
                    onclick="openImage(this.src)"
                >

                <div class="file-name">
                    ${escapeHtml(
                        message.file_name ||
                        "Image"
                    )}
                </div>

            </div>

        `;

    }



    /*
     * VIDEO
     */

    else if (
        message.message_type ===
        "video"
    ) {

        content += `

            <div class="file-message">

                <video
                    class="chat-video"
                    controls
                >

                    <source
                        src="${escapeHtml(
                            message.file_url
                        )}"
                    >

                </video>


                <div class="file-name">
                    ${escapeHtml(
                        message.file_name ||
                        "Video"
                    )}
                </div>

            </div>

        `;

    }



    /*
     * FILE
     */

    else if (
        message.message_type ===
        "file"
    ) {

        content += `

            <div class="file-message">

                <a
                    href="${escapeHtml(
                        message.file_url
                    )}"
                    target="_blank"
                    download
                    class="file-download"
                >
                    📎
                    ${escapeHtml(
                        message.file_name ||
                        "File"
                    )}
                </a>

            </div>

        `;

    }



    /*
     * MESSAGE FOOTER
     */

    let statusHTML =
        "";


    if (isMine) {

        let status =
            "sent";


        if (
            Number(
                message.is_read
            ) === 1
        ) {

            status =
                "seen";

        }


        statusHTML =
            getMessageStatusHTML(
                status
            );

    }


    content += `

        <div class="message-footer">

            <span class="time">
                ${escapeHtml(
                    formatMessageTime(
                        message.created_at
                    )
                )}
            </span>

            ${
                isMine
                ? `
                    <span
                        class="message-status"
                        data-status="${status}"
                    >
                        ${statusHTML}
                    </span>
                  `
                : ""
            }

        </div>

    `;


    div.innerHTML =
        content;


    container.appendChild(
        div
    );


    scrollMessages();

}



/* =========================================================
   FORMAT MESSAGE TIME
========================================================= */

function formatMessageTime(
    value
) {

    if (!value) {
        return "";
    }


    const date =
        new Date(
            value
        );


    if (
        Number.isNaN(
            date.getTime()
        )
    ) {

        return String(
            value
        );

    }


    return date.toLocaleTimeString(
        [],
        {
            hour: "2-digit",
            minute: "2-digit"
        }
    );

}



/* =========================================================
   MESSAGE STATUS HTML
========================================================= */

function getMessageStatusHTML(
    status
) {

    if (status === "seen") {

        return `
            <span
                class="seen-check"
                title="Seen"
            >
                ✓✓
            </span>
        `;

    }


    if (
        status === "delivered"
    ) {

        return `
            <span
                class="delivered-check"
                title="Delivered"
            >
                ✓✓
            </span>
        `;

    }


    return `
        <span
            class="sent-check"
            title="Sent"
        >
            ✓
        </span>
    `;

}

/* =========================================================
   SEND MESSAGE
========================================================= */

function sendMessage() {

    if (!selectedContact) {
        return;
    }


    const input =
        document.getElementById(
            "messageInput"
        );


    const message =
        input.value.trim();


    if (!message) {
        return;
    }


    const receiverId =
        Number(
            selectedContact.id
        );


    /*
     * Stop typing.
     */

    sendTypingStatus(
        false
    );


    /*
     * Socket unavailable.
     */

    if (!socket) {

        window.pendingMessage = {

            receiver_id:
                receiverId,

            message:
                message

        };


        input.value =
            "";


        connectSocket();


        return;

    }



    /*
     * Socket disconnected.
     */

    if (!socket.connected) {

        window.pendingMessage = {

            receiver_id:
                receiverId,

            message:
                message

        };


        input.value =
            "";


        try {

            socket.connect();

        } catch (error) {

            console.error(
                error
            );

        }


        return;

    }



    /*
     * Send immediately.
     */

    socket.emit(
        "send_message",
        {

            receiver_id:
                receiverId,

            message:
                message

        }
    );


    input.value =
        "";


    input.focus();

}

/* =========================================================

========================================================= */

function sendTypingStatus(
    typing
) {

    if (!socket) {
        return;
    }


    if (!socket.connected) {
        return;
    }


    if (!selectedContact) {
        return;
    }


    /*
     * Avoid duplicate typing events.
     */

    if (
        isTyping === typing
    ) {

        return;

    }


    isTyping =
        typing;


    socket.emit(
        "typing",
        {

            receiver_id:
                Number(
                    selectedContact.id
                ),

            typing:
                typing

        }
    );

}

/* =========================================================
   SIMPLE NOTIFICATION SOUND
========================================================= */

function playNotificationSound() {

    try {

        const AudioContext =
            window.AudioContext ||
            window.webkitAudioContext;


        if (!AudioContext) {
            return;
        }


        const context =
            new AudioContext();


        const oscillator =
            context.createOscillator();


        const gain =
            context.createGain();


        oscillator.frequency.value =
            700;


        oscillator.type =
            "sine";


        gain.gain.value =
            0.04;


        oscillator.connect(
            gain
        );


        gain.connect(
            context.destination
        );


        oscillator.start();


        setTimeout(
            function() {

                oscillator.stop();

                context.close();

            },
            120
        );

    } catch (e) {}

}

        const d=document.createElement('div');
        d.className='contact group-contact'; d.dataset.groupId=g.id;
        d.innerHTML=`<div class="avatar">${upgradeAvatar(g)}</div><div class="contact-info"><b>${upgradeEsc(g.name)}</b><span>${Number(g.member_count||0)} members</span></div>`;
        d.onclick=()=>selectGroupUpgrade(g); box.appendChild(d);
      });
    }
    box.insertAdjacentHTML('beforeend','<div class="list-title">CONTACTS</div>');
    if(loadedContacts.length){
      loadedContacts.forEach(c=>{
        const d=document.createElement('div'); d.className='contact'; d.dataset.id=c.id;
        d.innerHTML=`<div class="avatar">${upgradeAvatar(c)}</div><div class="contact-info"><b>${upgradeEsc(c.name)}</b><span>${upgradeEsc(c.last_message || c.email || '')}</span></div>${Number(c.unread_count||0)?`<span class="unread-badge">${c.unread_count}</span>`:''}`;
        d.onclick=()=>{selectedGroup=null; selectedContact=c; if(typeof selectContact==='function') selectContact(c);};
        box.appendChild(d);
      });
    } else {
      box.insertAdjacentHTML('beforeend','<div class="no-contacts">No contacts yet.</div>');
    }
  }catch(e){ console.error('CONTACT LIST ERROR',e); }
}

async function selectGroupUpgrade(g){
  selectedGroup=g; selectedContact=null;
  document.querySelectorAll('.contact').forEach(x=>x.classList.remove('active'));
  document.querySelector(`[data-group-id="${g.id}"]`)?.classList.add('active');
  const name=document.getElementById('chatName'); if(name) name.textContent=g.name;
  const status=document.getElementById('chatStatus'); if(status) status.textContent=`${Number(g.member_count||0)} members`;
  const av=document.getElementById('chatAvatar'); if(av) av.innerHTML=upgradeAvatar(g);
  const input=document.getElementById('messageInput'); if(input) input.disabled=false;
  const send=document.getElementById('sendBtn'); if(send) send.disabled=false;
  const box=document.getElementById('messages'); if(!box) return;
  box.innerHTML='';
  const r=await fetch('/api/groups/'+encodeURIComponent(g.id)+'/messages'); const d=await r.json();
  (d.messages||[]).forEach(addGroupMessageUpgrade); scrollMessages();
}
function addGroupMessageUpgrade(m){
  if(!selectedGroup || Number(m.group_id)!==Number(selectedGroup.id)) return;
  const box=document.getElementById('messages'); if(!box) return;
  if(box.querySelector(`[data-group-message-id="${m.id}"]`)) return;
  const own=currentUser && Number(m.sender_id)===Number(currentUser.id);
  const d=document.createElement('div'); d.className='message '+(own?'sent':'received'); d.dataset.groupMessageId=m.id;
  d.innerHTML=`${own?'':`<div class="group-sender">${upgradeEsc(m.sender_name||'')}</div>`}<div class="bubble">${upgradeEsc(String(m.message||'').trim())}</div><div class="message-time">${m.created_at?new Date(m.created_at).toLocaleTimeString([], {hour:'2-digit',minute:'2-digit'}):''}</div>`;
  box.appendChild(d); scrollMessages();
}

const originalSendMessage = window.sendMessage;
window.sendMessage = function(){
  if(!selectedGroup) return originalSendMessage?.();
  const input=document.getElementById('messageInput'); const text=(input?.value||'').trim();
  if(!text) return;
  if(!socket || !socket.connected){ if(typeof showNotification==='function') showNotification('Connecting...'); return; }
  socket.emit('send_group_message',{group_id:Number(selectedGroup.id),message:text}); input.value='';
};

function openProfileModalUpgrade(){
  const m=document.getElementById('profileModal'); if(!m){alert('Profile window is not available in this version.');return;}
  m.classList.add('show');
  fetch('/api/profile').then(r=>r.json()).then(d=>{
    const u=d.user||d.profile||d;
    const p=document.getElementById('profilePreview'); if(p) p.innerHTML=upgradeAvatar(u);
  }).catch(console.error);
}
function openGroupModalUpgrade(){
  const m=document.getElementById('groupModal'); if(!m){alert('New Group window is not available in this version.');return;}
  const box=document.getElementById('groupMemberList');
  if(box) box.innerHTML=loadedContacts.map(c=>`<label><input type="checkbox" value="${c.id}"> ${upgradeEsc(c.name)}</label>`).join('') || 'No contacts yet';
  m.classList.add('show');
}
function closeUpgradeModal(id){ document.getElementById(id)?.classList.remove('show'); }
async function uploadProfilePhotoUpgrade(){
  const f=document.getElementById('profilePhotoInput')?.files?.[0]; if(!f)return;
  const fd=new FormData(); fd.append('photo',f);
  const d=await (await fetch('/api/profile',{method:'POST',body:fd})).json();
  if(d.success){ const p=document.getElementById('profilePreview'); if(p)p.innerHTML=`<img src="${upgradeEsc(d.profile_photo)}" alt="">`; await loadContactsUpgrade(); closeUpgradeModal('profileModal'); }
  else alert(d.message||'Could not upload profile photo.');
}
async function createGroupUpgrade(){
  const name=(document.getElementById('groupNameInput')?.value||'').trim();
  const members=[...document.querySelectorAll('#groupMemberList input:checked')].map(x=>x.value);
  const msg=document.getElementById('groupMessage');
  if(!name){if(msg)msg.textContent='Enter a group name.';return;}
  const fd=new FormData(); fd.append('name',name); fd.append('member_ids',members.join(','));
  const f=document.getElementById('groupPhotoInput')?.files?.[0]; if(f)fd.append('photo',f);
  const d=await (await fetch('/api/groups',{method:'POST',body:fd})).json();
  if(d.success){closeUpgradeModal('groupModal');await loadContactsUpgrade();if(d.group)selectGroupUpgrade(d.group);}
  else if(msg)msg.textContent=d.message||'Could not create group.';
}

function wireUpgradeButtons(){
  const profileBtn=[...document.querySelectorAll('button,a')].find(x=>/profile/i.test(x.textContent||'') && !x.dataset.upgradeWired);
  if(profileBtn){profileBtn.dataset.upgradeWired='1';profileBtn.onclick=e=>{e.preventDefault();openProfileModalUpgrade();};}
  const groupBtn=[...document.querySelectorAll('button,a')].find(x=>/new\s*group/i.test(x.textContent||'') && !x.dataset.upgradeWired);
  if(groupBtn){groupBtn.dataset.upgradeWired='1';groupBtn.onclick=e=>{e.preventDefault();openGroupModalUpgrade();};}
}

function setupUpgradeSocket(){
  if(!socket || socket.__upgradeReady) return;
  socket.__upgradeReady=true;
  socket.on('new_group_message',m=>{ if(selectedGroup && Number(selectedGroup.id)===Number(m.group_id)) addGroupMessageUpgrade(m); loadContactsUpgrade(); });
  socket.on('group_created',()=>loadContactsUpgrade());
}
const originalConnectSocket=window.connectSocket;
window.connectSocket=function(){ originalConnectSocket?.(); setTimeout(setupUpgradeSocket,500); };
window.addEventListener('load',()=>{ setTimeout(()=>{loadContactsUpgrade();wireUpgradeButtons();setupUpgradeSocket();},700); });
window.openProfileModal=openProfileModalUpgrade;
window.openGroupModal=openGroupModalUpgrade;
window.createGroup=createGroupUpgrade;
window.uploadProfilePhoto=uploadProfilePhotoUpgrade;
window.loadContacts=loadContactsUpgrade;
</script>

<script>
// ===== FINAL UI FIXES =====
(function(){
  function byId(id){return document.getElementById(id)}
  function showModal(id){const el=byId(id); if(el){el.classList.add('show');el.style.display='flex';}}
  function hideModal(id){const el=byId(id); if(el){el.classList.remove('show');el.style.display='none';}}
  window.closeUpgradeModal=hideModal;

  // Make Profile/New Group controls work even if inline handlers are missing.
  document.addEventListener('click', function(e){
    const t=e.target.closest('#profileBtn,[data-action="profile"],.profile-btn,#newGroupBtn,[data-action="new-group"],.new-group-btn');
    if(!t) return;
    e.preventDefault();
    if(t.id==='profileBtn'||t.dataset.action==='profile'||t.classList.contains('profile-btn')) {
      if(typeof window.openProfileModal==='function') window.openProfileModal();
      else showModal('profileModal');
    } else {
      if(typeof window.openGroupModal==='function') window.openGroupModal();
      else showModal('groupModal');
    }
  });

  // Prevent contacts from disappearing after selecting an incoming chat.
  const originalSelect = window.selectContact;
  window.selectContact = async function(contact){
    window.selectedContact = contact;
    window.selectedGroup = null;
    if(typeof originalSelect==='function') return originalSelect.apply(this, arguments);
    const name=contact.custom_name||contact.name||contact.email||'Chat';
    const n=byId('chatName'), s=byId('chatStatus');
    if(n)n.textContent=name; if(s)s.textContent=contact.email||'';
    try { await window.loadMessages(contact.id); } catch(e){ console.error(e); }
  };

  // Always reload the real server-side contact/chat list after an incoming message.
  if(window.socket){
    window.socket.on('new_message', function(){
      if(typeof window.loadContacts==='function') setTimeout(window.loadContacts,80);
    });
  }

  // Fix custom contact display name whenever the API provides one.
  const oldLoad = window.loadContacts;
  if(typeof oldLoad==='function'){
    window.loadContacts = async function(){
      const result=await oldLoad.apply(this,arguments);
      document.querySelectorAll('.contact[data-id]').forEach(el=>{
        const id=Number(el.dataset.id);
        const c=(window.loadedContacts||[]).find(x=>Number(x.id)===id);
        if(c){const name=el.querySelector('.contact-name,.contact-info b'); if(name) name.textContent=c.custom_name||c.name||c.email;}
      });
      return result;
    };
  }
})();
</script>

</body>
</html>
