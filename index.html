<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>MyChat</title>

    <link rel="stylesheet" href="/style.css">

    <script src="https://cdn.socket.io/4.8.1/socket.io.min.js"></script>
</head>

<body>

<!-- =========================================================
     AUTH PAGE
========================================================= -->

<div class="auth-page" id="authPage">

    <div class="auth-box">

        <h1>MyChat</h1>

        <p class="auth-subtitle">
            Simple private messaging
        </p>


        <!-- LOGIN -->

        <div id="loginForm">

            <h2>Welcome Back</h2>

            <input
                type="email"
                id="loginEmail"
                placeholder="Email address"
            >

            <input
                type="password"
                id="loginPassword"
                placeholder="Password"
            >

            <button
                onclick="login()"
                title="Login"
            >
                ➔ Login
            </button>

            <p class="switch-text">
                Don't have an account?
                <span onclick="showSignup()">
                    Sign Up
                </span>
            </p>

        </div>


        <!-- SIGNUP -->

        <div
            id="signupForm"
            style="display:none;"
        >

            <h2>Create Account</h2>

            <input
                type="text"
                id="signupName"
                placeholder="Your name"
            >

            <input
                type="email"
                id="signupEmail"
                placeholder="Email address"
            >

            <input
                type="password"
                id="signupPassword"
                placeholder="Password"
            >

            <button
                onclick="signup()"
                title="Create Account"
            >
                👤 Create Account
            </button>

            <p class="switch-text">
                Already have an account?
                <span onclick="showLogin()">
                    Login
                </span>
            </p>

        </div>


        <p id="authMessage"></p>

    </div>

</div>


<!-- =========================================================
     CHAT APP
========================================================= -->

<div
    class="app"
    id="chatApp"
    style="display:none;"
>


    <!-- =====================================================
         SIDEBAR
    ====================================================== -->

    <aside class="sidebar">

        <div class="sidebar-header">

            <h1>MyChat</h1>

            <button
                class="profile-btn"
                onclick="logout()"
                title="Logout"
            >
                🚪 Logout
            </button>

        </div>


        <div class="current-user">

            Logged in as:
            <b id="currentUserName"></b>

        </div>


        <div class="search-box">

            <input
                type="text"
                id="searchInput"
                placeholder="Search contacts..."
            >

        </div>


        <button
            class="add-contact-btn"
            id="addContactBtn"
            title="Add Contact"
        >
            ➕ Add Contact
        </button>


        <div
            class="contacts"
            id="contacts"
        ></div>

    </aside>



    <!-- =====================================================
         CHAT
    ====================================================== -->

    <main class="chat">


        <!-- CHAT HEADER -->

        <header class="chat-header">

            <div class="chat-user">

                <div
                    class="avatar"
                    id="chatAvatar"
                >
                </div>


                <div>

                    <h2 id="chatName">
                        Select a contact
                    </h2>

                    <p id="chatStatus">
                    </p>

                </div>

            </div>

        </header>



        <!-- =================================================
             MESSAGES
        ================================================== -->

        <div
            class="messages"
            id="messages"
        >

            <div class="empty-chat">
                Select a contact to start chatting
            </div>

        </div>



        <!-- =================================================
             TYPING INDICATOR
        ================================================== -->

        <div
            id="typingIndicator"
            class="typing-indicator"
            style="display:none;"
        >
            <span id="typingText">
                Typing...
            </span>

            <span class="typing-dots">
                <i></i>
                <i></i>
                <i></i>
            </span>
        </div>



        <!-- =================================================
             MESSAGE AREA
        ================================================== -->

        <div class="message-area">

            <button
                class="file-btn"
                id="fileBtn"
                title="Send file"
                disabled
            >
                📎
            </button>


            <input
                type="file"
                id="fileInput"
                style="display:none;"
                accept="image/*,video/*,.pdf,.txt,.doc,.docx,.xls,.xlsx,.zip"
            >


            <input
                type="text"
                id="messageInput"
                placeholder="Type a message..."
                disabled
                autocomplete="off"
            >


            <button
                class="send-btn"
                id="sendBtn"
                title="Send"
                disabled
            >
                ✈
            </button>

        </div>

    </main>

</div>



<!-- =========================================================
     ADD CONTACT MODAL
========================================================= -->

<div
    class="modal"
    id="contactModal"
>

    <div class="modal-box">

        <button
            class="close-btn"
            id="closeModal"
            title="Close"
        >
            ✖
        </button>

        <h2>Add Contact</h2>

        <p>
            Enter your friend's email address
        </p>

        <input
            type="email"
            id="emailInput"
            placeholder="friend@example.com"
        >

        <button
            class="confirm-btn"
            id="confirmContact"
            title="Add Contact"
        >
            ✔
        </button>

        <p
            id="contactMessage"
            style="text-align:center;"
        ></p>

    </div>

</div>



<!-- =========================================================
     NOTIFICATION
========================================================= -->

<div
    id="notification"
    class="chat-notification"
    style="display:none;"
>
    <span id="notificationText"></span>
</div>



<script>

/* =========================================================
   GLOBAL VARIABLES
========================================================= */

let currentUser = null;

let selectedContact = null;

let socket = null;

let typingTimer = null;

let isTyping = false;

let typingUserId = null;

let notificationPermissionAsked = false;


/* =========================================================
   SOCKET.IO
========================================================= */

function connectSocket() {

    if (socket) {

        try {

            socket.removeAllListeners();

            socket.disconnect();

        } catch (e) {}

    }


    console.log(
        "Connecting to chat server..."
    );


    socket = io("/", {

        transports: [
            "websocket",
            "polling"
        ],

        upgrade: true,

        reconnection: true,

        reconnectionAttempts: Infinity,

        reconnectionDelay: 500,

        reconnectionDelayMax: 3000,

        timeout: 20000

    });



    /* =====================================================
       CONNECTED
    ===================================================== */

    socket.on(
        "connect",
        function() {

            console.log(
                "Socket.IO connected:",
                socket.id
            );


            updateSelectedContactStatus();


            /*
             * Pending message
             */

            if (window.pendingMessage) {

                const pending =
                    window.pendingMessage;

                window.pendingMessage =
                    null;


                socket.emit(
                    "send_message",
                    {
                        receiver_id:
                            Number(
                                pending.receiver_id
                            ),

                        message:
                            pending.message
                    }
                );

            }

        }
    );



    /* =====================================================
       ONLINE USERS
    ===================================================== */

    socket.on(
        "online_users",
        function(data) {

            if (!data) {
                return;
            }


            const users =
                data.users || [];


            document
                .querySelectorAll(
                    ".contact"
                )
                .forEach(
                    function(contact) {

                        const id =
                            Number(
                                contact.dataset.id
                            );


                        updateContactOnlineUI(
                            id,
                            users.includes(id)
                        );

                    }
                );


            updateSelectedContactStatus();

        }
    );



    /* =====================================================
       USER STATUS
    ===================================================== */

    socket.on(
        "user_status",
        function(data) {

            if (!data) {
                return;
            }


            const userId =
                Number(
                    data.user_id
                );


            updateContactOnlineUI(
                userId,
                Boolean(
                    data.online
                )
            );


            if (
                selectedContact &&
                Number(
                    selectedContact.id
                ) === userId
            ) {

                updateSelectedContactStatus(
                    Boolean(
                        data.online
                    )
                );

            }

        }
    );



    /* =====================================================
       TYPING
    ===================================================== */

    socket.on(
        "user_typing",
        function(data) {

            if (!data) {
                return;
            }


            const userId =
                Number(
                    data.user_id
                );


            if (
                !selectedContact ||
                Number(
                    selectedContact.id
                ) !== userId
            ) {

                return;

            }


            if (data.typing) {

                showTypingIndicator(
                    selectedContact.name
                );

            } else {

                hideTypingIndicator();

            }

        }
    );



    /* =====================================================
       MESSAGE SENT
    ===================================================== */

    socket.on(
        "message_sent",
        function(message) {

            console.log(
                "MESSAGE SENT:",
                message
            );


            if (!message) {
                return;
            }


            /*
             * IMPORTANT:
             *
             * Do NOT immediately add the
             * message twice.
             *
             * Server sends message_sent
             * only to sender.
             */

            if (
                selectedContact &&
                Number(
                    selectedContact.id
                ) ===
                Number(
                    message.receiver_id
                )
            ) {

                addMessageToScreen(
                    message
                );

            }


            loadContacts();

        }
    );



    /* =====================================================
       MESSAGE DELIVERED
    ===================================================== */

    socket.on(
        "message_delivered",
        function(data) {

            if (!data) {
                return;
            }


            console.log(
                "MESSAGE DELIVERED:",
                data
            );


            updateMessageStatus(
                data.message_id,
                "delivered"
            );

        }
    );



    /* =====================================================
       MESSAGES READ
    ===================================================== */

    socket.on(
        "messages_read",
        function(data) {

            if (!data) {
                return;
            }


            const contactId =
                Number(
                    data.contact_id
                );


            if (
                selectedContact &&
                Number(
                    selectedContact.id
                ) === contactId
            ) {

                markVisibleMessagesAsSeen();

            }

        }
    );



    /* =====================================================
       NEW MESSAGE
    ===================================================== */

    socket.on(
        "new_message",
        async function(message) {

            console.log(
                "NEW MESSAGE:",
                message
            );


            if (!message) {
                return;
            }


            // Confirm delivery only after this client has actually received
            // the message. The server then sends ✓✓ to the sender.
            if (socket && message.id && message.sender_id) {
                socket.emit(
                    "message_delivered_ack",
                    {
                        message_id: Number(message.id),
                        sender_id: Number(message.sender_id)
                    }
                );
            }


            const senderId =
                Number(
                    message.sender_id
                );


            /*
             * CURRENT CHAT OPEN
             */

            if (
                selectedContact &&
                Number(
                    selectedContact.id
                ) === senderId
            ) {

                addMessageToScreen(
                    message
                );


                /*
                 * Mark as read immediately.
                 */

                try {

                    await fetch(
                        "/api/messages/" +
                        senderId +
                        "/read",
                        {
                            method: "POST"
                        }
                    );


                    if (socket) {

                        socket.emit(
                            "mark_read",
                            {
                                contact_id:
                                    senderId
                            }
                        );

                    }

                } catch (error) {

                    console.error(
                        "Read status error:",
                        error
                    );

                }


                loadContacts();


                return;

            }



            /*
             * MESSAGE FROM OTHER CONTACT
             */

            try {

                const response =
                    await fetch(
                        "/api/user/" +
                        senderId
                    );


                const data =
                    await response.json();


                if (
                    data.success &&
                    data.user
                ) {

                    const sender =
                        data.user;


                    const existingContact =
                        document.querySelector(
                            '.contact[data-id="' +
                            sender.id +
                            '"]'
                        );


                    if (!existingContact) {

                        createTemporaryContact(
                            sender,
                            message
                        );

                    }

                }

            } catch (error) {

                console.error(
                    "Could not get sender:",
                    error
                );

            }


            loadContacts();


            /*
             * Notification
             */

            showNotification(
                "New message from " +
                (
                    selectedContact &&
                    Number(
                        selectedContact.id
                    ) === senderId
                        ? selectedContact.name
                        : "a contact"
                )
            );


            playNotificationSound();

        }
    );



    /* =====================================================
       MESSAGE ERROR
    ===================================================== */

    socket.on(
        "message_error",
        function(data) {

            console.error(
                "MESSAGE ERROR:",
                data
            );


            if (
                data &&
                data.message
            ) {

                showNotification(
                    data.message
                );

            }

        }
    );



    /* =====================================================
       CONNECTION ERROR
    ===================================================== */

    socket.on(
        "connect_error",
        function(error) {

            console.error(
                "Socket.IO connection error:",
                error
            );

        }
    );



    /* =====================================================
       DISCONNECT
    ===================================================== */

    socket.on(
        "disconnect",
        function(reason) {

            console.log(
                "Socket.IO disconnected:",
                reason
            );


            /*
             * If chat is open,
             * show temporary offline state.
             */

            if (selectedContact) {

                const status =
                    document.getElementById(
                        "chatStatus"
                    );


                if (status) {

                    status.textContent =
                        "Connecting...";

                }

            }

        }
    );

}



/* =========================================================
   AUTH UI
========================================================= */

function showLogin() {

    document.getElementById(
        "loginForm"
    ).style.display =
        "block";


    document.getElementById(
        "signupForm"
    ).style.display =
        "none";


    document.getElementById(
        "authMessage"
    ).textContent =
        "";

}



function showSignup() {

    document.getElementById(
        "loginForm"
    ).style.display =
        "none";


    document.getElementById(
        "signupForm"
    ).style.display =
        "block";


    document.getElementById(
        "authMessage"
    ).textContent =
        "";

}



function showAuthMessage(
    message,
    color
) {

    const element =
        document.getElementById(
            "authMessage"
        );


    element.textContent =
        message;


    element.style.color =
        color;

}



/* =========================================================
   SIGNUP
========================================================= */

async function signup() {

    const name =
        document.getElementById(
            "signupName"
        ).value.trim();


    const email =
        document.getElementById(
            "signupEmail"
        ).value.trim();


    const password =
        document.getElementById(
            "signupPassword"
        ).value;


    if (
        !name ||
        !email ||
        !password
    ) {

        showAuthMessage(
            "Please fill all fields.",
            "red"
        );

        return;

    }


    try {

        const response =
            await fetch(
                "/api/signup",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({
                            name:
                                name,

                            email:
                                email,

                            password:
                                password
                        })
                }
            );


        const data =
            await response.json();


        if (data.success) {

            showAuthMessage(
                "Account created! You can login now.",
                "green"
            );


            document.getElementById(
                "signupName"
            ).value = "";


            document.getElementById(
                "signupEmail"
            ).value = "";


            document.getElementById(
                "signupPassword"
            ).value = "";


            setTimeout(
                showLogin,
                1000
            );

        } else {

            showAuthMessage(
                data.message,
                "red"
            );

        }

    } catch (error) {

        console.error(
            error
        );


        showAuthMessage(
            "Server connection error.",
            "red"
        );

    }

}



/* =========================================================
   LOGIN
========================================================= */

async function login() {

    const email =
        document.getElementById(
            "loginEmail"
        ).value.trim();


    const password =
        document.getElementById(
            "loginPassword"
        ).value;


    if (
        !email ||
        !password
    ) {

        showAuthMessage(
            "Enter your email and password.",
            "red"
        );

        return;

    }


    try {

        const response =
            await fetch(
                "/api/login",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({
                            email:
                                email,

                            password:
                                password
                        })
                }
            );


        const data =
            await response.json();


        if (data.success) {

            currentUser =
                data.user;


            document.getElementById(
                "authPage"
            ).style.display =
                "none";


            document.getElementById(
                "chatApp"
            ).style.display =
                "flex";


            document.getElementById(
                "currentUserName"
            ).textContent =
                currentUser.name;


            requestNotificationPermission();


            connectSocket();


            loadContacts();

        } else {

            showAuthMessage(
                data.message,
                "red"
            );

        }

    } catch (error) {

        console.error(
            error
        );


        showAuthMessage(
            "Server connection error.",
            "red"
        );

    }

}



/* =========================================================
   CHECK LOGIN
========================================================= */

async function checkLogin() {

    try {

        const response =
            await fetch(
                "/api/me"
            );


        const data =
            await response.json();


        if (data.logged_in) {

            currentUser =
                data.user;


            document.getElementById(
                "authPage"
            ).style.display =
                "none";


            document.getElementById(
                "chatApp"
            ).style.display =
                "flex";


            document.getElementById(
                "currentUserName"
            ).textContent =
                currentUser.name;


            requestNotificationPermission();


            connectSocket();


            loadContacts();

        }

    } catch (error) {

        console.error(
            "Server not available:",
            error
        );

    }

}



/* =========================================================
   LOGOUT
========================================================= */

async function logout() {

    if (socket) {

        try {

            socket.disconnect();

        } catch (e) {}

        socket = null;

    }


    try {

        await fetch(
            "/api/logout",
            {
                method: "POST"
            }
        );

    } catch (error) {

        console.error(
            error
        );

    }


    currentUser = null;

    selectedContact = null;


    document.getElementById(
        "chatApp"
    ).style.display =
        "none";


    document.getElementById(
        "authPage"
    ).style.display =
        "flex";


    document.getElementById(
        "messageInput"
    ).value =
        "";


    document.getElementById(
        "messageInput"
    ).disabled =
        true;


    document.getElementById(
        "sendBtn"
    ).disabled =
        true;


    document.getElementById(
        "fileBtn"
    ).disabled =
        true;


    hideTypingIndicator();


    showLogin();

}



/* =========================================================
   LOAD CONTACTS
========================================================= */

async function loadContacts() {

    try {

        const response =
            await fetch(
                "/api/contacts"
            );


        const data =
            await response.json();


        const container =
            document.getElementById(
                "contacts"
            );


        if (!container) {
            return;
        }


        container.innerHTML =
            "";


        if (!data.success) {
            return;
        }


        if (
            !data.contacts ||
            data.contacts.length === 0
        ) {

            container.innerHTML = `
                <div class="no-contacts">
                    No contacts yet.
                    <br><br>
                    Click Add Contact
                </div>
            `;

            return;

        }


        data.contacts.forEach(
            function(contact) {

                createContactElement(
                    contact,
                    container
                );

            }
        );


        updateSelectedContactStatus();

    } catch (error) {

        console.error(
            "Could not load contacts:",
            error
        );

    }

}



/* =========================================================
   CREATE CONTACT ELEMENT
========================================================= */

function createContactElement(
    contact,
    container
) {

    const div =
        document.createElement(
            "div"
        );


    div.className =
        "contact";


    div.dataset.id =
        contact.id;


    if (
        selectedContact &&
        Number(
            selectedContact.id
        ) ===
        Number(
            contact.id
        )
    ) {

        div.classList.add(
            "active"
        );

    }


    const firstLetter =
        contact.name
        .charAt(0)
        .toUpperCase();


    const unread =
        Number(
            contact.unread_count ||
            contact.unread ||
            0
        );


    let unreadBadge =
        "";


    if (unread > 0) {

        unreadBadge = `
            <span class="unread-badge">
                ${
                    unread > 99
                    ? "99"
                    : unread
                }
            </span>
        `;

    }


    const online =
        Boolean(
            contact.online
        );


    const statusDot =
        online
        ? `
            <span
                class="online-dot"
                title="Online"
            ></span>
          `
        : `
            <span
                class="offline-dot"
                title="Offline"
            ></span>
          `;


    let preview =
        contact.last_message ||
        contact.email ||
        "";


    div.innerHTML = `

        <div class="avatar contact-avatar">

            ${escapeHtml(firstLetter)}

            ${statusDot}

        </div>


        <div class="contact-info">

            <div class="contact-name">
                ${escapeHtml(contact.name)}
            </div>

            <div class="last-message">
                ${escapeHtml(preview)}
            </div>

        </div>


        <div class="contact-right">

            ${unreadBadge}

        </div>

    `;


    div.addEventListener(
        "click",
        function() {

            selectContact(
                contact
            );

        }
    );


    container.appendChild(
        div
    );

}



/* =========================================================
   CONTACT ONLINE UI
========================================================= */

function updateContactOnlineUI(
    userId,
    online
) {

    const contact =
        document.querySelector(
            '.contact[data-id="' +
            userId +
            '"]'
        );


    if (!contact) {
        return;
    }


    const avatar =
        contact.querySelector(
            ".contact-avatar"
        );


    if (!avatar) {
        return;
    }


    const oldDot =
        avatar.querySelector(
            ".online-dot, .offline-dot"
        );


    if (oldDot) {
        oldDot.remove();
    }


    const dot =
        document.createElement(
            "span"
        );


    dot.className =
        online
        ? "online-dot"
        : "offline-dot";


    dot.title =
        online
        ? "Online"
        : "Offline";


    avatar.appendChild(
        dot
    );

}



/* =========================================================
   UPDATE CHAT HEADER STATUS
========================================================= */

function updateSelectedContactStatus(
    forcedStatus = null
) {

    if (!selectedContact) {
        return;
    }


    const status =
        document.getElementById(
            "chatStatus"
        );


    if (!status) {
        return;
    }


    if (
        forcedStatus !== null
    ) {

        status.textContent =
            forcedStatus
            ? "Online"
            : "Offline";

        status.classList.toggle(
            "online-status",
            forcedStatus
        );

        return;

    }


    if (
        typeof selectedContact.online !==
        "undefined"
    ) {

        const online =
            Boolean(
                selectedContact.online
            );


        status.textContent =
            online
            ? "Online"
            : "Offline";


        status.classList.toggle(
            "online-status",
            online
        );

        return;

    }


    status.textContent =
        selectedContact.email;

}



/* =========================================================
   SELECT CONTACT
========================================================= */

async function selectContact(
    contact
) {

    selectedContact =
        contact;


    document.getElementById(
        "chatName"
    ).textContent =
        contact.name;


    document.getElementById(
        "chatAvatar"
    ).textContent =
        contact.name
        .charAt(0)
        .toUpperCase();


    updateSelectedContactStatus();


    document.getElementById(
        "messageInput"
    ).disabled =
        false;


    document.getElementById(
        "sendBtn"
    ).disabled =
        false;


    document.getElementById(
        "fileBtn"
    ).disabled =
        false;


    hideTypingIndicator();


    /*
     * Mark messages read.
     */

    try {

        await fetch(
            "/api/messages/" +
            contact.id +
            "/read",
            {
                method: "POST"
            }
        );

    } catch (error) {

        console.error(
            "Read error:",
            error
        );

    }


    if (socket) {

        socket.emit(
            "mark_read",
            {
                contact_id:
                    contact.id
            }
        );

    }


    await loadMessages(
        contact.id
    );


    loadContacts();


    document.getElementById(
        "messageInput"
    ).focus();

}



/* =========================================================
   LOAD MESSAGES
========================================================= */

async function loadMessages(
    contactId
) {

    try {

        const response =
            await fetch(
                "/api/messages/" +
                contactId
            );


        const data =
            await response.json();


        const container =
            document.getElementById(
                "messages"
            );


        container.innerHTML =
            "";


        if (!data.success) {
            return;
        }


        if (
            !data.messages ||
            data.messages.length === 0
        ) {

            container.innerHTML = `
                <div class="empty-chat">
                    No messages yet.
                    <br>
                    Say hello
                </div>
            `;

            return;

        }


        data.messages.forEach(
            function(message) {

                addMessageToScreen(
                    message
                );

            }
        );


        scrollMessages();

    } catch (error) {

        console.error(
            "Message loading error:",
            error
        );

    }

}



/* =========================================================
   ADD MESSAGE
========================================================= */

function addMessageToScreen(
    message
) {

    const container =
        document.getElementById(
            "messages"
        );


    if (!container) {
        return;
    }


    /*
     * Prevent duplicates.
     */

    if (message.id) {

        const existing =
            container.querySelector(
                '[data-message-id="' +
                message.id +
                '"]'
            );


        if (existing) {

            /*
             * Existing message may have
             * received a new read status.
             */

            updateExistingMessageStatus(
                existing,
                message
            );

            return;

        }

    }


    /*
     * Remove empty message.
     */

    const empty =
        container.querySelector(
            ".empty-chat"
        );


    if (empty) {
        empty.remove();
    }


    const div =
        document.createElement(
            "div"
        );


    const isMine =
        Number(
            message.sender_id
        ) ===
        Number(
            currentUser.id
        );


    div.className =
        isMine
        ? "message sent"
        : "message received";


    if (message.id) {

        div.dataset.messageId =
            message.id;

    }


    let content =
        "";


    /*
     * TEXT
     */

    if (message.message) {

        content += `<div class="bubble">${escapeHtml(
            String(message.message || "").trim()
        )}</div>`;

    }



    /*
     * IMAGE
     */

    if (
        message.message_type ===
        "image"
    ) {

        content += `

            <div class="file-message">

                <img
                    src="${escapeHtml(
                        message.file_url
                    )}"
                    class="chat-image"
                    onclick="openImage(this.src)"
                >

                <div class="file-name">
                    ${escapeHtml(
                        message.file_name ||
                        "Image"
                    )}
                </div>

            </div>

        `;

    }



    /*
     * VIDEO
     */

    else if (
        message.message_type ===
        "video"
    ) {

        content += `

            <div class="file-message">

                <video
                    class="chat-video"
                    controls
                >

                    <source
                        src="${escapeHtml(
                            message.file_url
                        )}"
                    >

                </video>


                <div class="file-name">
                    ${escapeHtml(
                        message.file_name ||
                        "Video"
                    )}
                </div>

            </div>

        `;

    }



    /*
     * FILE
     */

    else if (
        message.message_type ===
        "file"
    ) {

        content += `

            <div class="file-message">

                <a
                    href="${escapeHtml(
                        message.file_url
                    )}"
                    target="_blank"
                    download
                    class="file-download"
                >
                    📎
                    ${escapeHtml(
                        message.file_name ||
                        "File"
                    )}
                </a>

            </div>

        `;

    }



    /*
     * MESSAGE FOOTER
     */

    let statusHTML =
        "";


    if (isMine) {

        let status =
            "sent";


        if (
            Number(
                message.is_read
            ) === 1
        ) {

            status =
                "seen";

        }


        statusHTML =
            getMessageStatusHTML(
                status
            );

    }


    content += `

        <div class="message-footer">

            <span class="time">
                ${escapeHtml(
                    formatMessageTime(
                        message.created_at
                    )
                )}
            </span>

            ${
                isMine
                ? `
                    <span
                        class="message-status"
                        data-status="${status}"
                    >
                        ${statusHTML}
                    </span>
                  `
                : ""
            }

        </div>

    `;


    div.innerHTML =
        content;


    container.appendChild(
        div
    );


    scrollMessages();

}



/* =========================================================
   FORMAT MESSAGE TIME
========================================================= */

function formatMessageTime(
    value
) {

    if (!value) {
        return "";
    }


    const date =
        new Date(
            value
        );


    if (
        Number.isNaN(
            date.getTime()
        )
    ) {

        return String(
            value
        );

    }


    return date.toLocaleTimeString(
        [],
        {
            hour: "2-digit",
            minute: "2-digit"
        }
    );

}



/* =========================================================
   MESSAGE STATUS HTML
========================================================= */

function getMessageStatusHTML(
    status
) {

    if (status === "seen") {

        return `
            <span
                class="seen-check"
                title="Seen"
            >
                ✓✓
            </span>
        `;

    }


    if (
        status === "delivered"
    ) {

        return `
            <span
                class="delivered-check"
                title="Delivered"
            >
                ✓✓
            </span>
        `;

    }


    return `
        <span
            class="sent-check"
            title="Sent"
        >
            ✓
        </span>
    `;

}



/* =========================================================
   UPDATE MESSAGE STATUS
========================================================= */

function updateMessageStatus(
    messageId,
    status
) {

    const message =
        document.querySelector(
            '[data-message-id="' +
            messageId +
            '"]'
        );


    if (!message) {
        return;
    }


    const statusElement =
        message.querySelector(
            ".message-status"
        );


    if (!statusElement) {
        return;
    }


    statusElement.dataset.status =
        status;


    statusElement.innerHTML =
        getMessageStatusHTML(
            status
        );

}



/* =========================================================
   UPDATE EXISTING MESSAGE
========================================================= */

function updateExistingMessageStatus(
    element,
    message
) {

    if (
        Number(
            message.is_read
        ) === 1
    ) {

        updateMessageStatus(
            message.id,
            "seen"
        );

    }

}



/* =========================================================
   MARK VISIBLE MESSAGES AS SEEN
========================================================= */

function markVisibleMessagesAsSeen() {

    document
        .querySelectorAll(
            ".message.sent .message-status"
        )
        .forEach(
            function(status) {

                status.dataset.status =
                    "seen";


                status.innerHTML =
                    getMessageStatusHTML(
                        "seen"
                    );

            }
        );

}



/* =========================================================
   SEND MESSAGE
========================================================= */

function sendMessage() {

    if (!selectedContact) {
        return;
    }


    const input =
        document.getElementById(
            "messageInput"
        );


    const message =
        input.value.trim();


    if (!message) {
        return;
    }


    const receiverId =
        Number(
            selectedContact.id
        );


    /*
     * Stop typing.
     */

    sendTypingStatus(
        false
    );


    /*
     * Socket unavailable.
     */

    if (!socket) {

        window.pendingMessage = {

            receiver_id:
                receiverId,

            message:
                message

        };


        input.value =
            "";


        connectSocket();


        return;

    }



    /*
     * Socket disconnected.
     */

    if (!socket.connected) {

        window.pendingMessage = {

            receiver_id:
                receiverId,

            message:
                message

        };


        input.value =
            "";


        try {

            socket.connect();

        } catch (error) {

            console.error(
                error
            );

        }


        return;

    }



    /*
     * Send immediately.
     */

    socket.emit(
        "send_message",
        {

            receiver_id:
                receiverId,

            message:
                message

        }
    );


    input.value =
        "";


    input.focus();

}



/* =========================================================
   SEND BUTTON
========================================================= */

document.getElementById(
    "sendBtn"
).addEventListener(
    "click",
    function() {

        sendMessage();

    }
);



/* =========================================================
   ENTER TO SEND
========================================================= */

document.getElementById(
    "messageInput"
).addEventListener(
    "keydown",
    function(event) {

        if (
            event.key ===
            "Enter"
        ) {

            event.preventDefault();

            sendMessage();

        }

    }
);



/* =========================================================
   TYPING DETECTION
========================================================= */

document.getElementById(
    "messageInput"
).addEventListener(
    "input",
    function() {

        if (!selectedContact) {
            return;
        }


        if (
            this.value.length > 0
        ) {

            sendTypingStatus(
                true
            );


            clearTimeout(
                typingTimer
            );


            typingTimer =
                setTimeout(
                    function() {

                        sendTypingStatus(
                            false
                        );

                    },
                    1200
                );

        } else {

            sendTypingStatus(
                false
            );

        }

    }
);



/* =========================================================
   TYPING STATUS
========================================================= */

function sendTypingStatus(
    typing
) {

    if (!socket) {
        return;
    }


    if (!socket.connected) {
        return;
    }


    if (!selectedContact) {
        return;
    }


    /*
     * Avoid duplicate typing events.
     */

    if (
        isTyping === typing
    ) {

        return;

    }


    isTyping =
        typing;


    socket.emit(
        "typing",
        {

            receiver_id:
                Number(
                    selectedContact.id
                ),

            typing:
                typing

        }
    );

}



/* =========================================================
   SHOW TYPING
========================================================= */

function showTypingIndicator(
    name
) {

    const indicator =
        document.getElementById(
            "typingIndicator"
        );


    const text =
        document.getElementById(
            "typingText"
        );


    if (!indicator) {
        return;
    }


    if (text) {

        text.textContent =
            name +
            " is typing";

    }


    indicator.style.display =
        "flex";


    scrollMessages();

}



/* =========================================================
   HIDE TYPING
========================================================= */

function hideTypingIndicator() {

    const indicator =
        document.getElementById(
            "typingIndicator"
        );


    if (indicator) {

        indicator.style.display =
            "none";

    }

}



/* =========================================================
   FILE UPLOAD
========================================================= */

const fileBtn =
    document.getElementById(
        "fileBtn"
    );


const fileInput =
    document.getElementById(
        "fileInput"
    );


fileBtn.addEventListener(
    "click",
    function() {

        if (!selectedContact) {
            return;
        }


        fileInput.click();

    }
);



fileInput.addEventListener(
    "change",
    async function() {

        const file =
            this.files[0];


        if (!file) {
            return;
        }


        if (!selectedContact) {

            alert(
                "Select a contact first."
            );

            return;

        }


        const maxSize =
            100 *
            1024 *
            1024;


        if (
            file.size >
            maxSize
        ) {

            alert(
                "File is too large. Maximum size is 100 MB."
            );


            this.value =
                "";


            return;

        }


        const formData =
            new FormData();


        formData.append(
            "file",
            file
        );


        formData.append(
            "receiver_id",
            selectedContact.id
        );


        try {

            fileBtn.disabled =
                true;


            fileBtn.textContent =
                "⏳";


            const response =
                await fetch(
                    "/api/upload",
                    {
                        method: "POST",

                        body:
                            formData
                    }
                );


            const data =
                await response.json();


            if (data.success) {

                /*
                 * Server also emits
                 * message_sent.
                 *
                 * The duplicate check prevents
                 * the same message appearing twice.
                 */

                addMessageToScreen(
                    data.message
                );


                loadContacts();

            } else {

                alert(
                    data.message
                );

            }

        } catch (error) {

            console.error(
                "Upload error:",
                error
            );


            alert(
                "File upload failed."
            );

        }


        fileBtn.disabled =
            false;


        fileBtn.textContent =
            "📎";


        this.value =
            "";

    }
);



/* =========================================================
   OPEN IMAGE
========================================================= */

function openImage(

) {

    window.open(
        src,
        "_blank"
    );

}

   SCROLL

function scrollMessages() {

    }

}

const modal =

document.getElementById(

async function addContact() {

    const email =
        document.getElementById(
            "emailInput"
        ).value.trim();


    if (!email) {

        showContactMessage(
            "Enter an email address.",
            "red"
        );


        return;

    }


    try {

        const response =
            await fetch(
                "/api/add-contact",
                {

                    method:
                        "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    },

                    body:
                        JSON.stringify({
                            email:
                                email
                        })

                }
            );


        const data =
            await response.json();


        if (data.success) {

            showContactMessage(
                "Contact added successfully!",
                "green"
            );


            document.getElementById(
                "emailInput"
            ).value =
                "";


            await loadContacts();


            setTimeout(
                function() {

                    modal.classList.remove(
                        "show"
                    );

                },
                800
            );

        } else {

            showContactMessage(
                data.message,
                "red"
            );

        }

    } catch (error) {

        console.error(
            error
        );


        showContactMessage(
            "Server connection error.",
            "red"
        );

    }

}



/* =========================================================
   CONTACT MESSAGE
========================================================= */

function showContactMessage(
    message,
    color
) {

    const element =
        document.getElementById(
            "contactMessage"
        );


    element.textContent =
        message;


    element.style.color =
        color;

}



/* =========================================================
   SEARCH
========================================================= */

document.getElementById(
    "searchInput"
).addEventListener(
    "input",
    function() {

        const search =
            this.value
            .toLowerCase();


        document
            .querySelectorAll(
                ".contact"
            )
            .forEach(
                function(contact) {

                    const name =
                        contact
                        .querySelector(
                            ".contact-name"
                        )
                        ?.textContent
                        .toLowerCase();


                    if (
                        name &&
                        name.includes(
                            search
                        )
                    ) {

                        contact.style.display =
                            "flex";

                    } else {

                        contact.style.display =
                            "none";

                    }

                }
            );

    }
);



/* =========================================================
   NOTIFICATIONS
========================================================= */

function showNotification(
    text
) {

    const notification =
        document.getElementById(
            "notification"
        );


    const notificationText =
        document.getElementById(
            "notificationText"
        );


    if (
        !notification ||
        !notificationText
    ) {

        return;

    }


    notificationText.textContent =
        text;


    notification.style.display =
        "block";


    /*
     * Browser notification
     */

    if (
        "Notification" in window &&
        Notification.permission ===
            "granted"
    ) {

        try {

            new Notification(
                "MyChat",
                {
                    body:
                        text
                }
            );

        } catch (e) {}

    }


    clearTimeout(
        window.notificationTimer
    );


    window.notificationTimer =
        setTimeout(
            function() {

                notification.style.display =
                    "none";

            },
            3000
        );

}



/* =========================================================
   NOTIFICATION PERMISSION
========================================================= */

function requestNotificationPermission() {

    if (
        notificationPermissionAsked
    ) {

        return;

    }


    notificationPermissionAsked =
        true;


    if (
        "Notification" in window &&
        Notification.permission ===
            "default"
    ) {

        Notification.requestPermission()
            .catch(
                function() {}
            );

    }

}



/* =========================================================
   SIMPLE NOTIFICATION SOUND
========================================================= */

function playNotificationSound() {

    try {

        const AudioContext =
            window.AudioContext ||
            window.webkitAudioContext;


        if (!AudioContext) {
            return;
        }


        const context =
            new AudioContext();


        const oscillator =
            context.createOscillator();


        const gain =
            context.createGain();


        oscillator.frequency.value =
            700;


        oscillator.type =
            "sine";


        gain.gain.value =
            0.04;


        oscillator.connect(
            gain
        );


        gain.connect(
            context.destination
        );


        oscillator.start();


        setTimeout(
            function() {

                oscillator.stop();

                context.close();

            },
            120
        );

    } catch (e) {}

}



/* =========================================================
   TEMPORARY CONTACT
========================================================= */

function createTemporaryContact(
    user,
    firstMessage
) {

    const container =
        document.getElementById(
            "contacts"
        );


    if (!container) {
        return;
    }


    const existing =
        document.querySelector(
            '.contact[data-id="' +
            user.id +
            '"]'
        );


    if (existing) {
        return;
    }


    const div =
        document.createElement(
            "div"
        );


    div.className =
        "contact temporary-contact";


    div.dataset.id =
        user.id;


    const firstLetter =
        user.name
        .charAt(0)
        .toUpperCase();


    div.innerHTML = `

        <div class="avatar contact-avatar">

            ${escapeHtml(
                firstLetter
            )}

            <span
                class="online-dot"
                title="Online"
            ></span>

        </div>


        <div class="contact-info">

            <div class="contact-name">
                ${escapeHtml(
                    user.name
                )}
            </div>


            <div class="last-message">

                ${
                    firstMessage &&
                    firstMessage.message
                    ? escapeHtml(
                        firstMessage.message
                    )
                    : escapeHtml(
                        user.email
                    )
                }

            </div>

        </div>


        <div class="contact-right">

            <span class="unread-badge">
                1
            </span>

        </div>

    `;


    div.addEventListener(
        "click",
        async function() {

            const contact = {

                id:
                    user.id,

                name:
                    user.name,

                email:
                    user.email,

                online:
                    true

            };


            await selectContact(
                contact
            );


            div.remove();

        }
    );


    container.prepend(
        div
    );

}



/* =========================================================
   SECURITY
========================================================= */

function escapeHtml(
    text
) {

    if (
        text === null ||
        text === undefined
    ) {

        return "";

    }


    const div =
        document.createElement(
            "div"
        );


    div.textContent =
        String(text);


    return div.innerHTML;

}
